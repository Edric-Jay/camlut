
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111310">
<title>CHROMA — Film Camera</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111310;
  --panel: #20221e;
  --ink: #f0f0e8;
  --muted: #969b90;
  --accent: #d7e2cb;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.app {
  width: 100%;
  max-width: 540px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  padding: max(12px, env(safe-area-inset-top)) 16px
    max(12px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}
header, .row, .footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.app > header { flex: 0 0 auto; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  color: #171b15;
  font-size: 23px;
}
h1 { margin: 0; font-size: 16px; letter-spacing: 3px; }
.subtitle {
  margin-top: 3px;
  font-size: 9px;
  letter-spacing: 1.8px;
  color: var(--muted);
}
.status {
  border: 1px solid #34372f;
  padding: 7px 9px;
  border-radius: 30px;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 1px;
}
.viewfinder {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  background: #20231e;
  border-radius: 15px;
}
#preview {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
#video { display: none; }
.guides {
  position: absolute;
  inset: 12%;
  pointer-events: none;
  opacity: .22;
  background:
    linear-gradient(90deg, transparent 33.1%, #fff 33.3%, transparent 33.6%, transparent 66.4%, #fff 66.6%, transparent 66.9%),
    linear-gradient(0deg, transparent 33.1%, #fff 33.3%, transparent 33.6%, transparent 66.4%, #fff 66.6%, transparent 66.9%);
}
.finder-top {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 1.4px;
  text-shadow: 0 1px 6px #000;
  pointer-events: none;
}
.live-dot { color: #e2d8ba; }
.message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  text-align: center;
  padding: 24px;
  background: #20231e;
}
.message p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  margin: 0;
}
.primary {
  border: 0;
  border-radius: 30px;
  background: var(--accent);
  color: #171b15;
  padding: 13px 20px;
  font-weight: 650;
  font-size: 12px;
}
.filter-bar { flex: 0 0 auto; }
.current-look {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #34372f;
  border-radius: 11px;
  background: #20221e;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
}
.current-look .look-meta { display: grid; gap: 4px; }
.current-look small {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 1.5px;
}
.current-look strong {
  font-size: 13px;
  letter-spacing: 1.5px;
}
.chevron { color: var(--accent); font-size: 22px; }
.section-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
}
.intensity { margin-top: 11px; }
.intensity .row { margin-bottom: 7px; }
output { font-size: 12px; color: var(--accent); }
input[type=range] {
  display: block;
  width: 100%;
  margin: 0;
  accent-color: var(--accent);
}
.footer {
  flex: 0 0 auto;
  gap: 12px;
  padding: 2px 0;
}
.tool {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid #363930;
  background: var(--panel);
  font-size: 19px;
}
.tool:disabled, .shutter:disabled {
  opacity: .4;
  cursor: default;
}
.shutter {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  padding: 5px;
  background: transparent;
  border: 2px solid #e9e9df;
}
.shutter span {
  display: block;
  height: 100%;
  border-radius: 50%;
  background: var(--accent);
  transition: transform .1s;
}
.shutter:active span { transform: scale(.88); }
.footer-note {
  color: var(--muted);
  font-size: 9px;
  text-align: center;
  letter-spacing: 1px;
  margin-top: 6px;
}
#notice {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--accent);
  text-align: center;
  overflow-wrap: anywhere;
}

/* Filter drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgb(0 0 0 / 65%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s, visibility .22s;
}
.filter-drawer {
  position: fixed;
  z-index: 21;
  bottom: 0;
  left: 50%;
  width: min(100%, 540px);
  max-height: min(76dvh, 620px);
  padding: 10px 16px max(20px, env(safe-area-inset-bottom));
  background: #1b1d19;
  border: 1px solid #383b32;
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  transform: translate(-50%, 105%);
  transition: transform .25s ease;
  overflow-y: auto;
  overscroll-behavior: contain;
  visibility: hidden;
}
body.drawer-open .drawer-backdrop {
  opacity: 1;
  visibility: visible;
}
body.drawer-open .filter-drawer {
  transform: translate(-50%, 0);
  visibility: visible;
}
.drawer-handle {
  width: 38px;
  height: 4px;
  margin: 0 auto 18px;
  border-radius: 8px;
  background: #55584f;
}
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.drawer-header h2 { font-size: 18px; margin: 0; }
.drawer-header p {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1.2px;
  margin: 6px 0 0;
}
.close-drawer {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid #393c34;
  background: #292b25;
}
.drawer-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}
.look {
  min-width: 0;
  min-height: 62px;
  border: 1px solid #30332d;
  background: var(--panel);
  padding: 10px 3px;
  border-radius: 10px;
  font-size: 10px;
  letter-spacing: .7px;
  color: #c6c9bf;
}
.look.active {
  background: #303a30;
  border-color: #84947b;
  color: #f4f4eb;
}
.look small {
  display: block;
  margin-top: 5px;
  font-size: 9px;
  letter-spacing: 0;
  color: var(--muted);
}
@media (max-height: 650px) {
  .app { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .logo { width: 31px; height: 31px; }
  .shutter { width: 56px; height: 56px; }
  .tool { width: 40px; height: 40px; }
  .current-look { padding: 8px 12px; }
  .intensity { margin-top: 7px; }
}
@media (prefers-reduced-motion: reduce) {
  .filter-drawer, .drawer-backdrop { transition: none; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo">◉</div>
      <div>
        <h1>CHROMA</h1>
        <div class="subtitle">FILM CAMERA / 001</div>
      </div>
    </div>
    <div class="status" id="status">STANDBY</div>
  </header>

  <section class="viewfinder" aria-label="Live camera viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="preview" aria-label="Graded camera preview"></canvas>
    <div class="guides"></div>
    <div class="finder-top">
      <span id="lookName">CHROME 01</span>
      <span class="live-dot" id="liveLabel">● READY</span>
    </div>
    <div class="message" id="message">
      <div style="font-size:38px">◉</div>
      <p>Find your perspective.<br>See the color before you shoot.</p>
      <button class="primary" id="start">OPEN CAMERA</button>
      <p id="error" role="status"></p>
    </div>
  </section>

  <section class="filter-bar">
    <button class="current-look" id="openFilters"
            aria-expanded="false" aria-controls="filterDrawer">
      <span class="look-meta">
        <small>CURRENT COLOR PROFILE</small>
        <strong id="currentLook">CHROME 01</strong>
      </span>
      <span class="chevron">⌃</span>
    </button>

    <div class="intensity">
      <div class="row">
        <label class="section-label" for="strength">LOOK INTENSITY</label>
        <output id="strengthValue">75%</output>
      </div>
      <input id="strength" type="range" min="0" max="100" value="75">
    </div>
  </section>

  <div id="notice" role="status" aria-live="polite"></div>

  <div class="footer">
    <button class="tool" id="flip" aria-label="Switch camera"
            title="Switch camera" disabled>↻</button>
    <div style="flex:1;text-align:center">
      <button class="shutter" id="capture" aria-label="Take photo" disabled>
        <span></span>
      </button>
      <div class="footer-note">SAVE FRAME</div>
    </div>
    <button class="tool" id="reset" aria-label="Reset settings"
            title="Reset settings">↺</button>
  </div>
</main>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<section class="filter-drawer" id="filterDrawer"
         role="dialog" aria-modal="true"
         aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-handle"></div>
  <header class="drawer-header">
    <div>
      <h2 id="drawerTitle">Choose your look</h2>
      <p>12 FILM-INSPIRED COLOR PROFILES</p>
    </div>
    <button id="closeFilters" class="close-drawer"
            aria-label="Close filters">✕</button>
  </header>

  <div class="drawer-grid">
    <button class="look active" data-look="chrome" aria-pressed="true">CHROME<small>Cool / Contrast</small></button>
    <button class="look" data-look="portra" aria-pressed="false">PORTRA<small>Warm / Soft</small></button>
    <button class="look" data-look="mono" aria-pressed="false">MONO<small>Silver / B&W</small></button>
    <button class="look" data-look="golden" aria-pressed="false">GOLDEN<small>Amber / Warm</small></button>
    <button class="look" data-look="ektar" aria-pressed="false">EKTAR<small>Rich / Vivid</small></button>
    <button class="look" data-look="fuji" aria-pressed="false">FUJI<small>Olive / Green</small></button>
    <button class="look" data-look="teal" aria-pressed="false">CINE TEAL<small>Cool / Cinematic</small></button>
    <button class="look" data-look="faded" aria-pressed="false">FADED<small>Matte / Muted</small></button>
    <button class="look" data-look="noir" aria-pressed="false">NOIR<small>Deep / B&W</small></button>
    <button class="look" data-look="arctic" aria-pressed="false">ARCTIC<small>Blue / Cool</small></button>
    <button class="look" data-look="vintage" aria-pressed="false">VINTAGE<small>Sepia / Soft</small></button>
    <button class="look" data-look="pastel" aria-pressed="false">PASTEL<small>Airy / Soft</small></button>
  </div>
</section>

<script>
(() => {
  "use strict";

  const $ = selector => document.querySelector(selector);
  const video = $("#video");
  const canvas = $("#preview");
  const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    preserveDrawingBuffer: true
  });

  const message = $("#message");
  const error = $("#error");
  const status = $("#status");
  const capture = $("#capture");
  const flip = $("#flip");
  const strength = $("#strength");
  const strengthValue = $("#strengthValue");
  const lookName = $("#lookName");
  const liveLabel = $("#liveLabel");
  const notice = $("#notice");
  const drawer = $("#filterDrawer");
  const backdrop = $("#drawerBackdrop");
  const openFilters = $("#openFilters");
  const closeFilters = $("#closeFilters");
  const currentLook = $("#currentLook");

  let stream = null;
  let facing = "environment";
  let activeLook = "chrome";
  let intensity = 0.75;
  let raf = 0;
  let texture = null;
  let program = null;
  let ready = false;
  let starting = false;

  const looks = {
    chrome:  { id: 0, name: "CHROME 01" },
    portra:  { id: 1, name: "PORTRA 01" },
    mono:    { id: 2, name: "MONO 01" },
    golden:  { id: 3, name: "GOLDEN 01" },
    ektar:   { id: 4, name: "EKTAR 01" },
    fuji:    { id: 5, name: "FUJI 01" },
    teal:    { id: 6, name: "CINE TEAL" },
    faded:   { id: 7, name: "FADED 01" },
    noir:    { id: 8, name: "NOIR 01" },
    arctic:  { id: 9, name: "ARCTIC 01" },
    vintage: { id: 10, name: "VINTAGE 01" },
    pastel:  { id: 11, name: "PASTEL 01" }
  };

  const vertexSource = `
    attribute vec2 a_position;
    varying vec2 v_uv;
    void main() {
      v_uv = (a_position + 1.0) * 0.5;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentSource = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_image;
    uniform float u_strength;
    uniform float u_look;
    uniform float u_mirror;

    vec3 grade(vec3 c) {
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      vec3 result = c;

      if (u_look < 0.5) {
        result = c * vec3(0.91, 1.01, 1.10);
        result += vec3(0.035, 0.012, -0.008) * l;
      } else if (u_look < 1.5) {
        result = (c * vec3(1.09, 1.015, 0.91) - 0.5) * 0.88 + 0.53;
      } else if (u_look < 2.5) {
        float g = (l - 0.5) * 1.13 + 0.5;
        result = vec3(g);
      } else if (u_look < 3.5) {
        result = c * vec3(1.12, 1.02, 0.86);
        result += vec3(0.045, 0.018, -0.025) * l;
      } else if (u_look < 4.5) {
        result = (c - 0.5) * 1.18 + 0.5;
        result = mix(vec3(l), result * vec3(1.04, 1.0, 0.96), 0.8);
      } else if (u_look < 5.5) {
        result = c * vec3(0.96, 1.08, 0.91);
        result.g += 0.025 * (1.0 - l);
      } else if (u_look < 6.5) {
        result = c + vec3(0.0, 0.025, 0.045) * (1.0 - l);
        result.r += 0.055 * l;
        result.b *= 0.94;
      } else if (u_look < 7.5) {
        result = (c - 0.5) * 0.78 + 0.55;
        result = mix(result, vec3(l) * 0.8 + 0.15, 0.15);
      } else if (u_look < 8.5) {
        float g = clamp((l - 0.5) * 1.45 + 0.5, 0.0, 1.0);
        result = vec3(g);
      } else if (u_look < 9.5) {
        result = c * vec3(0.88, 1.04, 1.15);
        result += vec3(-0.015, 0.015, 0.035);
      } else if (u_look < 10.5) {
        result = c * vec3(1.10, 1.02, 0.88);
        result = (result - 0.5) * 0.85 + 0.55;
      } else {
        result = mix(c, vec3(l), 0.18);
        result = result * 0.88 + 0.08;
        result += vec3(0.045, 0.015, 0.035);
      }

      return mix(c, clamp(result, 0.0, 1.0), u_strength);
    }

    void main() {
      vec2 uv = v_uv;
      if (u_mirror > 0.5) uv.x = 1.0 - uv.x;
      vec3 color = texture2D(u_image, uv).rgb;
      gl_FragColor = vec4(grade(color), 1.0);
    }
  `;

  function setDrawer(open) {
    document.body.classList.toggle("drawer-open", open);
    drawer.setAttribute("aria-hidden", String(!open));
    openFilters.setAttribute("aria-expanded", String(open));

    if (open) {
      closeFilters.focus();
    } else {
      openFilters.focus();
    }
  }

  openFilters.addEventListener("click", () => setDrawer(true));
  closeFilters.addEventListener("click", () => setDrawer(false));
  backdrop.addEventListener("click", () => setDrawer(false));

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" &&
        document.body.classList.contains("drawer-open")) {
      setDrawer(false);
    }
  });

  function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const reason = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(reason || "Shader compilation failed.");
    }
    return shader;
  }

  function initGL() {
    if (!gl) throw new Error("WebGL is unavailable in this browser.");

    const vs = compileShader(gl.VERTEX_SHADER, vertexSource);
    const fs = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
    program = gl.createProgram();

    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);

    gl.deleteShader(vs);
    gl.deleteShader(fs);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "Program linking failed.");
    }

    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1, 1, -1, -1, 1, 1, 1
    ]), gl.STATIC_DRAW);

    const position = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    ready = true;
  }

  function render() {
    if (!stream || !ready || video.readyState < 2) {
      raf = requestAnimationFrame(render);
      return;
    }

    if (canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);

    try {
      gl.texImage2D(
        gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA,
        gl.UNSIGNED_BYTE, video
      );
    } catch (e) {
      raf = requestAnimationFrame(render);
      return;
    }

    gl.uniform1i(gl.getUniformLocation(program, "u_image"), 0);
    gl.uniform1f(gl.getUniformLocation(program, "u_strength"), intensity);
    gl.uniform1f(gl.getUniformLocation(program, "u_look"), looks[activeLook].id);
    gl.uniform1f(
      gl.getUniformLocation(program, "u_mirror"),
      facing === "user" ? 1 : 0
    );

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    raf = requestAnimationFrame(render);
  }

  async function startCamera() {
    if (starting) return;

    error.textContent = "";
    notice.textContent = "";

    if (!navigator.mediaDevices?.getUserMedia) {
      error.textContent = "Camera access requires HTTPS or localhost.";
      return;
    }

    starting = true;
    status.textContent = "CONNECTING";
    $("#start").disabled = true;

    try {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      cancelAnimationFrame(raf);

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      await video.play();

      if (!ready) initGL();

      message.style.display = "none";
      capture.disabled = false;
      flip.disabled = false;
      status.textContent = "CAMERA ON";
      liveLabel.textContent = "● LIVE";
      render();
    } catch (e) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      status.textContent = "STANDBY";
      message.style.display = "flex";
      error.textContent = e.name === "NotAllowedError"
        ? "Camera permission denied. Allow camera access in browser settings."
        : e.name === "NotFoundError"
          ? "No compatible camera was found."
          : "Unable to start camera. Check HTTPS and browser permissions.";

      console.error(e);
    } finally {
      starting = false;
      $("#start").disabled = false;
    }
  }

  $("#start").addEventListener("click", startCamera);

  document.querySelectorAll("[data-look]").forEach(button => {
    button.addEventListener("click", () => {
      activeLook = button.dataset.look;
      const name = looks[activeLook].name;

      lookName.textContent = name;
      currentLook.textContent = name;

      document.querySelectorAll("[data-look]").forEach(item => {
        const selected = item === button;
        item.classList.toggle("active", selected);
        item.setAttribute("aria-pressed", String(selected));
      });

      setDrawer(false);
    });
  });

  strength.addEventListener("input", () => {
    intensity = Number(strength.value) / 100;
    strengthValue.value = strength.value + "%";
    strengthValue.textContent = strength.value + "%";
  });

  flip.addEventListener("click", async () => {
    if (!stream || starting) return;
    facing = facing === "environment" ? "user" : "environment";
    await startCamera();
  });

  $("#reset").addEventListener("click", () => {
    activeLook = "chrome";
    intensity = 0.75;
    strength.value = 75;
    strengthValue.value = "75%";
    strengthValue.textContent = "75%";
    lookName.textContent = looks.chrome.name;
    currentLook.textContent = looks.chrome.name;

    document.querySelectorAll("[data-look]").forEach(button => {
      const selected = button.dataset.look === "chrome";
      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    notice.textContent = "Settings reset.";
  });

  capture.addEventListener("click", () => {
    if (!stream || !ready || !canvas.width) return;

    notice.textContent = "Preparing photo…";

    canvas.toBlob(blob => {
      if (!blob) {
        notice.textContent = "Export failed. Please try again.";
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `chroma-${activeLook}-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 3000);
      notice.textContent = "Photo exported as PNG.";
    }, "image/png");
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(raf);
    } else if (stream) {
      render();
    }
  });

  window.addEventListener("pagehide", () => {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(track => track.stop());
  });
})();
</script>
</body>
</html>
