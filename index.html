<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111310" />
<title>CHROMA — Film Camera</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111310;
    --panel: #1b1d19;
    --ink: #f0f0e8;
    --muted: #969b90;
    --accent: #d7e2cb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app {
    max-width: 540px; min-height: 100dvh; margin: auto;
    padding: max(18px, env(safe-area-inset-top)) 18px
      max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 20px;
  }
  header, .row, .footer, .controls, .look-list {
    display: flex; align-items: center; justify-content: space-between;
  }
  header { min-height: 46px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    display: grid; place-items: center; width: 38px; height: 38px;
    border-radius: 11px; background: var(--accent); color: #171b15;
    font-size: 24px;
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: 3px; }
  .subtitle { margin-top: 4px; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .status {
    border: 1px solid #34372f; padding: 7px 10px; border-radius: 30px;
    color: var(--muted); font-size: 10px; letter-spacing: 1px;
  }
  .viewfinder {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    max-height: 58dvh; min-height: 300px; overflow: hidden;
    background: #20231e; border-radius: 15px;
  }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  #video { display: none; }
  .guides {
    position: absolute; inset: 12%; pointer-events: none; opacity: .25;
    background:
      linear-gradient(90deg, transparent 33.1%, #fff 33.3%, transparent 33.6%, transparent 66.4%, #fff 66.6%, transparent 66.9%),
      linear-gradient(0deg, transparent 33.1%, #fff 33.3%, transparent 33.6%, transparent 66.4%, #fff 66.6%, transparent 66.9%);
  }
  .finder-top {
    position: absolute; top: 15px; left: 15px; right: 15px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: 1.5px; text-shadow: 0 1px 6px #000;
  }
  .live-dot { color: #e2d8ba; }
  .message {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 12px;
    text-align: center; padding: 28px; background: #20231e;
  }
  .message p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
  .primary {
    border: 0; border-radius: 30px; background: var(--accent); color: #171b15;
    padding: 13px 20px; font-weight: 650; font-size: 12px;
  }
  .section-label {
    color: var(--muted); font-size: 10px; letter-spacing: 1.8px;
  }
  .look-list { gap: 9px; margin-top: 12px; }
  .look {
    flex: 1; min-width: 0; border: 1px solid #30332d; background: var(--panel);
    padding: 14px 5px; border-radius: 10px; font-size: 10px;
    letter-spacing: 1.2px; color: #c6c9bf;
  }
  .look.active { background: #303a30; border-color: #75846d; color: #f4f4eb; }
  .look small { display: block; margin-top: 6px; font-size: 9px; color: var(--muted); }
  .intensity { margin-top: 21px; }
  .intensity .row { margin-bottom: 10px; }
  output { font-size: 12px; color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .footer { gap: 12px; margin-top: auto; padding-top: 4px; }
  .tool {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid #363930; background: #20221e; font-size: 19px;
  }
  .shutter {
    width: 70px; height: 70px; border-radius: 50%; padding: 5px;
    background: transparent; border: 2px solid #e9e9df;
  }
  .shutter span {
    display: block; height: 100%; border-radius: 50%;
    background: var(--accent); transition: transform .1s;
  }
  .shutter:active span { transform: scale(.88); }
  .footer-note { color: var(--muted); font-size: 9px; text-align: center; letter-spacing: 1px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-height: 700px) {
    .app { gap: 13px; }
    .viewfinder { min-height: 240px; max-height: 48dvh; }
    .intensity { margin-top: 13px; }
    .look { padding: 10px 4px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo">◉</div>
      <div>
        <h1>CHROMA</h1>
        <div class="subtitle">FILM CAMERA / 001</div>
      </div>
    </div>
    <div class="status" id="status">STANDBY</div>
  </header>

  <section class="viewfinder" aria-label="Live camera viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="preview" aria-label="Color-graded camera preview"></canvas>
    <div class="guides"></div>
    <div class="finder-top">
      <span id="lookName">CHROME 01</span>
      <span class="live-dot" id="liveLabel">● READY</span>
    </div>
    <div class="message" id="message">
      <div style="font-size:38px">◉</div>
      <p>Find your perspective.<br>See the color before you shoot.</p>
      <button class="primary" id="start">OPEN CAMERA</button>
      <p id="error" role="status"></p>
    </div>
  </section>

  <section>
    <div class="section-label">SELECT YOUR COLOR PROFILE</div>
    <div class="look-list">
      <button class="look active" data-look="chrome">CHROME<small>Cool / Contrast</small></button>
      <button class="look" data-look="portra">PORTRA<small>Warm / Soft</small></button>
      <button class="look" data-look="mono">MONO<small>Silver / Grain</small></button>
    </div>
    <div class="intensity">
      <div class="row">
        <label class="section-label" for="strength">LOOK INTENSITY</label>
        <output id="strengthValue">75%</output>
      </div>
      <input id="strength" type="range" min="0" max="100" value="75" />
    </div>
  </section>

  <div class="footer">
    <button class="tool" id="flip" aria-label="Switch camera" title="Switch camera">↻</button>
    <div style="flex:1;text-align:center">
      <button class="shutter" id="capture" aria-label="Take photo" disabled><span></span></button>
      <div class="footer-note" style="margin-top:8px">SAVE FRAME</div>
    </div>
    <button class="tool" id="reset" aria-label="Reset color intensity" title="Reset intensity">↺</button>
  </div>
</main>

<script>
(() => {
  const video = document.querySelector("#video");
  const canvas = document.querySelector("#preview");
  const ctx = canvas.getContext("webgl", {
    alpha: false, antialias: false, preserveDrawingBuffer: true
  });
  const message = document.querySelector("#message");
  const error = document.querySelector("#error");
  const status = document.querySelector("#status");
  const capture = document.querySelector("#capture");
  const strength = document.querySelector("#strength");
  const strengthValue = document.querySelector("#strengthValue");
  const lookName = document.querySelector("#lookName");
  const liveLabel = document.querySelector("#liveLabel");

  let stream = null;
  let facing = "environment";
  let activeLook = "chrome";
  let intensity = 0.75;
  let raf = 0;
  let texture = null;
  let program = null;
  let positionBuffer = null;

  const vertexShader = `
    attribute vec2 a_position;
    varying vec2 v_uv;
    void main() {
      v_uv = (a_position + 1.0) * 0.5;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShader = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_image;
    uniform float u_strength;
    uniform float u_look;
    uniform float u_mirror;

    vec3 grade(vec3 c) {
      float l = dot(c, vec3(0.299, 0.587, 0.114));

      if (u_look < 0.5) {
        // Chrome: cool shadows, restrained green, warm highlights.
        vec3 cool = c * vec3(0.91, 1.01, 1.10);
        cool.b += (1.0 - l) * 0.025;
        cool.r += l * 0.045;
        cool.g *= 0.97;
        return mix(c, cool, u_strength);
      } else if (u_look < 1.5) {
        // Portra-inspired: warm skin tones and a softer curve.
        vec3 warm = c * vec3(1.09, 1.015, 0.91);
        warm = (warm - 0.5) * 0.88 + 0.53;
        warm.g += 0.012;
        return mix(c, clamp(warm, 0.0, 1.0), u_strength);
      } else {
        // Mono: black and white with a gentle contrast curve.
        float gray = dot(c, vec3(0.299, 0.587, 0.114));
        gray = (gray - 0.5) * 1.13 + 0.5;
        return mix(c, vec3(clamp(gray, 0.0, 1.0)), u_strength);
      }
    }

    void main() {
      vec2 uv = v_uv;
      if (u_mirror > 0.5) uv.x = 1.0 - uv.x;
      vec3 color = texture2D(u_image, uv).rgb;
      color = grade(color);
      gl_FragColor = vec4(color, 1.0);
    }
  `;

  function compile(type, source) {
    const shader = ctx.createShader(type);
    ctx.shaderSource(shader, source);
    ctx.compileShader(shader);
    if (!ctx.getShaderParameter(shader, ctx.COMPILE_STATUS)) {
      throw new Error(ctx.getShaderInfoLog(shader));
    }
    return shader;
  }

  function initGL() {
    if (!ctx) throw new Error("WebGL is not supported by this browser.");
    program = ctx.createProgram();
    ctx.attachShader(program, compile(ctx.VERTEX_SHADER, vertexShader));
    ctx.attachShader(program, compile(ctx.FRAGMENT_SHADER, fragmentShader));
    ctx.linkProgram(program);
    if (!ctx.getProgramParameter(program, ctx.LINK_STATUS)) {
      throw new Error("Could not initialize color processing.");
    }

    ctx.useProgram(program);
    positionBuffer = ctx.createBuffer();
    ctx.bindBuffer(ctx.ARRAY_BUFFER, positionBuffer);
    ctx.bufferData(ctx.ARRAY_BUFFER, new Float32Array([
      -1,-1, 1,-1, -1,1, 1,1
    ]), ctx.STATIC_DRAW);

    const loc = ctx.getAttribLocation(program, "a_position");
    ctx.enableVertexAttribArray(loc);
    ctx.vertexAttribPointer(loc, 2, ctx.FLOAT, false, 0, 0);

    texture = ctx.createTexture();
    ctx.bindTexture(ctx.TEXTURE_2D, texture);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.LINEAR);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.LINEAR);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
    ctx.pixelStorei(ctx.UNPACK_FLIP_Y_WEBGL, true);
  }

  function render() {
    if (!stream || video.readyState < 2) {
      raf = requestAnimationFrame(render);
      return;
    }

    // Render at the source aspect ratio; CSS fits the viewfinder.
    if (canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.viewport(0, 0, canvas.width, canvas.height);
    }

    ctx.useProgram(program);
    ctx.activeTexture(ctx.TEXTURE0);
    ctx.bindTexture(ctx.TEXTURE_2D, texture);
    ctx.texImage2D(ctx.TEXTURE_2D, 0, ctx.RGBA, ctx.RGBA,
      ctx.UNSIGNED_BYTE, video);

    ctx.uniform1i(ctx.getUniformLocation(program, "u_image"), 0);
    ctx.uniform1f(ctx.getUniformLocation(program, "u_strength"), intensity);
    ctx.uniform1f(ctx.getUniformLocation(program, "u_look"),
      activeLook === "chrome" ? 0 : activeLook === "portra" ? 1 : 2);
    // Mirror only the front-camera preview.
    ctx.uniform1f(ctx.getUniformLocation(program, "u_mirror"),
      facing === "user" ? 1 : 0);

    ctx.drawArrays(ctx.TRIANGLE_STRIP, 0, 4);
    raf = requestAnimationFrame(render);
  }

  async function startCamera() {
    error.textContent = "";
    if (!navigator.mediaDevices?.getUserMedia) {
      error.textContent = "Open this page on HTTPS or localhost to use the camera.";
      return;
    }

    try {
      if (stream) stream.getTracks().forEach(track => track.stop());
      cancelAnimationFrame(raf);
      status.textContent = "CONNECTING";

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      await video.play();

      if (!program) initGL();

      message.style.display = "none";
      capture.disabled = false;
      status.textContent = "CAMERA ON";
      liveLabel.textContent = "● LIVE";
      render();
    } catch (e) {
      status.textContent = "STANDBY";
      error.textContent = e.name === "NotAllowedError"
        ? "Camera permission denied. Allow camera access in your browser settings."
        : "Could not open the camera. Try HTTPS and check camera availability.";
      message.style.display = "flex";
    }
  }

  document.querySelector("#start").addEventListener("click", startCamera);

  document.querySelectorAll("[data-look]").forEach(button => {
    button.addEventListener("click", () => {
      activeLook = button.dataset.look;
      document.querySelectorAll("[data-look]").forEach(b =>
        b.classList.toggle("active", b === button));
      lookName.textContent = {
        chrome: "CHROME 01", portra: "PORTRA 01", mono: "MONO 01"
      }[activeLook];
    });
  });

  strength.addEventListener("input", () => {
    intensity = Number(strength.value) / 100;
    strengthValue.value = strength.value + "%";
    strengthValue.textContent = strength.value + "%";
  });

  document.querySelector("#flip").addEventListener("click", async () => {
    facing = facing === "environment" ? "user" : "environment";
    if (stream) await startCamera();
  });

  document.querySelector("#reset").addEventListener("click", () => {
    strength.value = 75;
    intensity = 0.75;
    strengthValue.value = "75%";
    strengthValue.textContent = "75%";
  });

  capture.addEventListener("click", () => {
    if (!stream || !canvas.width) return;
    canvas.toBlob(blob => {
      if (!blob) {
        error.textContent = "Couldn't export this frame. Please try again.";
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `chroma-${activeLook}-${Date.now()}.png`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      status.textContent = "PHOTO SAVED";
      setTimeout(() => {
        if (stream) status.textContent = "CAMERA ON";
      }, 1600);
    }, "image/png");
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else if (stream) render();
  });

  window.addEventListener("pagehide", () => {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(track => track.stop());
  });
})();
</script>
</body>
</html>
